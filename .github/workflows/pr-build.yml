name: PR Build Check

on:
  pull_request:
    branches:
      - DEV
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v4

      - run: uv sync

      - name: Build docs
        run: uv run mkdocs build
